[project]
name = "ingestion-service"
version = "0.1.0"
description = "Downstream — ingestion-service. Milestone 1: envelope validation, dedup, event-worthiness filter, Trigger persistence, trigger.detected Kafka publication."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "psycopg[binary]>=3.1,<4",
    "pydantic-settings>=2,<3",
    "kafka-python-ng>=2.2,<3",
    "envelope-schemas",
    "domain-models",
    "event-contracts",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

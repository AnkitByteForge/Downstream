[project]
name = "key-resolution-service"
version = "0.1.0"
description = "Downstream — key-resolution-service. Milestone 2: consumes trigger.detected, resolves spec_section_refs against the graph's real SpecSection<->CostCode business-key match, writes artifact_identity_map, publishes keys.resolved."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1,<4",
    "pydantic-settings>=2,<3",
    "kafka-python-ng>=2.2,<3",
    "neo4j>=5,<6",
    "event-contracts",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

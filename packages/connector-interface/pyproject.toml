[project]
name = "connector-interface"
version = "0.1.0"
description = "Downstream — the shared adapter contract every Connector implements."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "envelope-schemas",
    "domain-models",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
